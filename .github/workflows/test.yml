name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Chromium for the render tests, matching the Playwright version render.py pins.
      - run: uv run --python ${{ matrix.python }} skills/resume-render/scripts/render.py --install-browser --with-deps
      # render.py's and extract_text.py's dependencies come from their inline metadata.
      # CI is set, so render and import tests never skip.
      - run: >-
          uv run --python ${{ matrix.python }} --with pytest
          --with-requirements skills/resume-render/scripts/render.py
          --with-requirements skills/resume-import/scripts/extract_text.py
          pytest
